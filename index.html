<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illuso: illusion and attention tests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F5F3;--ink:#14202B;--mut:#5B6A74;--line:#C9D4CF;--card:#FFFFFF;--acc:#0B7A6B;--acc-ink:#FFFFFF;--stage:#1D252B;--warn:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E171D;--ink:#E4ECEF;--mut:#93A3AC;--line:#2A3942;--card:#16232B;--acc:#38C2AC;--acc-ink:#06201B;--stage:#0A1115;--warn:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E171D;--ink:#E4ECEF;--mut:#93A3AC;--line:#2A3942;--card:#16232B;--acc:#38C2AC;--acc-ink:#06201B;--stage:#0A1115;--warn:#FF8A80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
h1{font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
h2{font-weight:600;font-size:22px;margin:28px 0 8px}
p{margin:0 0 14px;max-width:62ch}
.mut{color:var(--mut)}
.step{color:var(--mut);font-size:15px;margin:0 0 10px}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:600 16px "Bricolage Grotesque",system-ui,sans-serif;padding:13px 20px;border-radius:10px;border:1.5px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.err{color:var(--warn);min-height:1.4em;margin-top:8px}
.stage{background:var(--stage);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:200px;margin:10px 0 16px;color:#E9EEF0}
.stage svg{width:100%;height:auto;display:block}
.stage svg path{stroke:#E9EEF0;stroke-width:3;stroke-linecap:round;fill:none}
.word{font-weight:800;font-size:clamp(44px,12vw,72px);letter-spacing:.04em}
.fix{font-size:48px;color:#8FA0A9}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btns button{background:var(--card);color:var(--ink);border-color:var(--line);padding:16px 6px}
@media (max-width:420px){.btns{grid-template-columns:repeat(2,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:800}
.stat span{font-size:14px;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
:root{--bg:#F6F6FC;--ink:#0F1235;--mut:#5E6285;--line:#D5D7EC;--card:#FFFFFF;--acc:#2D3BE8;--acc-ink:#FFFFFF;--stage:#0F1235}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C24;--ink:#ECEDFF;--mut:#9A9EC8;--line:#272B55;--card:#12163A;--acc:#8B97FF;--acc-ink:#0A0C24;--stage:#05061A}}
:root[data-theme="dark"]{--bg:#0A0C24;--ink:#ECEDFF;--mut:#9A9EC8;--line:#272B55;--card:#12163A;--acc:#8B97FF;--acc-ink:#0A0C24;--stage:#05061A}
body{font:400 16px/1.6 "Poppins","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.stat b,button{font-family:"Poppins","Poppins",system-ui,sans-serif}
h1{font-weight:800;font-size:clamp(30px,7vw,44px);letter-spacing:-.02em;line-height:1.05}
h1.mark{font-size:clamp(76px,22vw,132px);letter-spacing:-.05em;line-height:.9;color:var(--acc);margin:6px 0 8px}
h2{font-weight:700;font-size:21px}
.tag{font-family:"Poppins",system-ui,sans-serif;font-weight:600;font-size:20px;margin:0 0 18px}
.hero{margin:6px 0 22px}
.hero svg{width:100%;max-width:460px;height:auto;display:block}
.hero .l{stroke:var(--acc);stroke-width:5;stroke-linecap:round;fill:none}
.hero .g{stroke:var(--mut);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.guides{opacity:0;animation:rev .8s 1.4s forwards}
@keyframes rev{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.guides{animation:none;opacity:1}}
.step{color:var(--acc);font-weight:600}
input[type=text],input[type=number]{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:10px 2px;font-size:19px}
input[type=text]:focus,input[type=number]:focus{border-bottom-color:var(--acc)}
button{border-radius:999px;padding:13px 26px;font-weight:700}
button.alt{border-width:2px}
.btns button{border-radius:14px;background:transparent;color:var(--ink);border:2px solid var(--line);font-family:"Poppins",system-ui,sans-serif;font-weight:600}
.stage{border-radius:22px;background:var(--stage)}
.stats{gap:24px}
.stat{border:0;border-top:4px solid var(--acc);border-radius:0;background:transparent;padding:10px 0 0}
.stat b{font-size:40px;font-weight:800;color:var(--acc)}
th{color:var(--acc);font-weight:700;border-bottom:2px solid var(--acc)}
textarea{border:0;border-left:4px solid var(--acc);border-radius:0;background:var(--card)}
:root{--sp1:#C6E9E5;--sp2:#F8E7C9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sp1:#0B2F36;--sp2:#2B2112}}
:root[data-theme="dark"]{--sp1:#0B2F36;--sp2:#2B2112}
.shell{display:flex;min-height:100vh;max-width:1000px;margin:0 auto}
main{flex:1;min-width:0;max-width:680px;margin:0}
#nav{width:220px;flex:none;padding:26px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:flex-start;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 26px "Poppins",system-ui,sans-serif;color:var(--acc);letter-spacing:-.03em}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.items{display:flex;flex-direction:column;gap:6px}
#nav button{text-align:left;border-radius:12px;padding:11px 14px;background:transparent;color:var(--ink);border:0;font-weight:600}
#nav button.on{background:var(--acc);color:var(--acc-ink)}
#nav #theme{margin-top:auto;border:2px solid var(--line);text-align:center;font-size:14px}
#lockmsg{display:none;font-size:13px;color:var(--mut);margin:0}
.lock #lockmsg{display:block}
.lock #nav .items button{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{padding:8px 16px;font-size:15px;background:transparent;color:var(--ink);border:2px solid var(--line)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
@media (max-width:760px){
 .shell{flex-direction:column}
 #nav{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
 .brand{font-size:22px}.brand img{width:36px;height:36px}
 .items{order:3;width:100%;flex-direction:row}
 #nav .items button{flex:1;text-align:center;padding:9px 6px;font-size:14px}
 #nav #theme{margin:0 0 0 auto;padding:8px 14px}
}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;background:linear-gradient(160deg,var(--sp1),var(--sp2));color:var(--ink);transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(64vw,300px);height:auto;border-radius:50%;animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
.sp-tag{font:600 20px "Poppins",system-ui,sans-serif;margin:0;animation:fadeup .8s .6s both}
#enter{animation:fadeup .8s .9s both}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash img,.sp-tag,#enter{animation:none}}
input[type=password]{width:100%;font:inherit;background:transparent;color:var(--ink);border:0;border-bottom:2px solid var(--line);border-radius:0;padding:10px 2px;font-size:19px}
.ovl{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(160deg,var(--sp1),var(--sp2))}
.ovl.dlg{z-index:60;background:rgba(10,12,36,.55)}
.ovl .box{width:100%;max-width:420px;background:var(--bg);color:var(--ink);border-radius:20px;padding:26px;margin:auto}
.ovl h1{font-size:26px;margin:0 0 8px}
#lock{display:none}
body.locked #lock{display:flex}
body.locked .shell{visibility:hidden}
#nav #lockbtn{margin-top:auto;border:2px solid var(--line);text-align:center;font-size:14px}
#nav #theme{margin-top:8px}
@media (max-width:760px){#nav #lockbtn{margin:0 0 0 auto;padding:8px 14px}#nav #theme{margin:0}}
.lk{font-size:11px;font-weight:500;opacity:.75;margin-left:6px;display:none}
body:not(.owner) .lk{display:inline}
#lockbtn{display:none}
body.owner.hascfg #lockbtn{display:block}
</style></head>

<script>
const COL={red:'#E5384B',blue:'#3D8BFF',green:'#2FBF6B',yellow:'#F2C230'};
const NAMES=Object.keys(COL), STD=200, ST_TRIALS=20, DEV=(matchMedia('(pointer:coarse)').matches?'touch':'mouse')+' '+screen.width+'x'+screen.height;
const PRAC=[{cond:'congruent',word:'red',ink:'red'},{cond:'incongruent',word:'blue',ink:'green'},{cond:'incongruent',word:'yellow',ink:'red'},{cond:'congruent',word:'green',ink:'green'}];
const $=s=>document.querySelector(s), app=$('#app');
const CFG=window.ILLUSO_OWNER||null;
let all=[],PRIV=null,OWNER=!CFG,keep=[],saveQ=Promise.resolve();
const te=new TextEncoder(),td=new TextDecoder();
const u8=b=>{const a=new Uint8Array(b);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const fb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){const m=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const getInbox=()=>{try{const v=JSON.parse(localStorage.getItem('pl_inbox')||'[]');return Array.isArray(v)?v:[]}catch(e){return []}};
const setInbox=a=>{try{localStorage.setItem('pl_inbox',JSON.stringify(a))}catch(e){}};
const groupRows=rows=>{const g={};rows.forEach(r=>{const k=r.participant+'\u0001'+(r.session||0);(g[k]=g[k]||[]).push(r)});return Object.values(g)};
async function gz(s){if(!window.CompressionStream)return {z:0,b:te.encode(s)};const st=new Blob([te.encode(s)]).stream().pipeThrough(new CompressionStream('gzip'));return {z:1,b:new Uint8Array(await new Response(st).arrayBuffer())}}
async function gunz(b,z){if(!z)return td.decode(b);const st=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));return td.decode(await new Response(st).arrayBuffer())}
async function sealRows(rows){
  const pub=await crypto.subtle.importKey('jwk',CFG.pub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  const ak=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12)),g=await gz(JSON.stringify(rows));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},ak,g.b);
  const k=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',ak));
  return {v:1,z:g.z,k:u8(k),iv:u8(iv),ct:u8(ct)};
}
async function openRec(rec){
  const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},PRIV,fb(rec.k));
  const ak=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fb(rec.iv)},ak,fb(rec.ct));
  return JSON.parse(await gunz(new Uint8Array(pt),rec.z));
}
async function unlockOwner(pass){
  const v=CFG.vault,k=await derive(pass,fb(v.salt));
  const jwk=JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fb(v.iv)},k,fb(v.ct))));
  PRIV=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
  all=[];keep=[];
  for(const rec of getInbox()){try{all.push(...await openRec(rec))}catch(e){keep.push(rec)}}
  OWNER=true;document.body.classList.add('owner');
}
async function persistInbox(rows){const out=[];for(const g of groupRows(rows))out.push(await sealRows(g));setInbox(out.concat(keep))}
const save=()=>{
  if(!CFG){try{localStorage.setItem('pl_rows',JSON.stringify(all))}catch(e){}return}
  if(!OWNER)return;
  const snap=all.slice();saveQ=saveQ.then(()=>persistInbox(snap)).catch(()=>{});
};
async function submitSession(rows){
  if(!CFG){all.push(...rows);save();return null}
  const rec=await sealRows(rows);const ib=getInbox();ib.push(rec);setInbox(ib);
  if(OWNER)all.push(...rows);
  return 'ILLUSO1:'+btoa(JSON.stringify(rec));
}
async function makeOwnerConfig(pass,contact){
  const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),prv=await crypto.subtle.exportKey('jwk',kp.privateKey);
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await derive(pass,salt),te.encode(JSON.stringify(prv)));
  return 'window.ILLUSO_OWNER='+JSON.stringify({pub,vault:{salt:u8(salt),iv:u8(iv),ct:u8(ct)},contact:contact||''})+';\n';
}

/* Test 1: Müller-Lyer */
function fin(x,y,type,side){if(type==='none')return'';const d=type==='tails'?side:-side;return `M${x} ${y}l${d*16} -16M${x} ${y}l${d*16} 16`}
function line(cx,y,L,type){const a=cx-L/2,b=cx+L/2;return `<path d="M${a} ${y}H${b}${fin(a,y,type,-1)}${fin(b,y,type,1)}"/>`}
function runML(c,i){
  if(i>=c.length){stroopIntro();return}
  const cond=c[i], other=cond==='tails'?'heads':cond==='heads'?'tails':'none';
  const start=Math.round(Math.random()<.5?130+Math.random()*40:250+Math.random()*40);
  app.innerHTML=`<p class="step">Test 1 of 2: line match, trial ${i+1} of ${c.length}</p>
  <h2 style="margin-top:0">Make the bottom line as long as the top line</h2>
  <div class="stage"><svg viewBox="0 0 420 220" role="img" aria-label="Two horizontal lines with arrow ends"><g>${line(210,60,STD,cond)}</g><g id="adj">${line(210,160,start,other)}</g></svg></div>
  <input id="sl" type="range" min="120" max="320" step="1" value="${start}" aria-label="Bottom line length">
  <div class="row"><button id="ok">Confirm match</button></div>`;
  const sl=$('#sl');
  sl.oninput=()=>{$('#adj').innerHTML=line(210,160,+sl.value,other)};
  $('#ok').onclick=()=>{
    const L=+sl.value, raw=(L-STD)/STD*100, strength=cond==='heads'?-raw:raw;
    mine.push(row('line',i+1,'standard_'+cond,L,+strength.toFixed(2),'',''));
    runML(c,i+1);
  };
}

/* Test 2: Stroop */
function stroopIntro(){
  app.innerHTML=`<p class="step">Test 2 of 2: ink color</p><h2 style="margin-top:0">Name the ink color, not the word</h2>
  <p>A color word will appear. Tap the button for the color it is printed in, ignoring what the word says. Be fast and accurate. On a keyboard, press R, G, B or Y.</p>
  <div class="stage"><span class="word" style="color:${COL.blue}">GREEN</span></div>
  <p class="mut">Here the correct answer is blue. You will do 4 practice trials with feedback first, then the real test.</p>
  <div class="row"><button id="go2">Start practice</button></div>`;
  $('#go2').onclick=()=>{
    const T=[];
    for(let k=0;k<ST_TRIALS/2;k++){const w=NAMES[k%4];T.push({cond:'congruent',word:w,ink:w});
      const o=NAMES.filter(n=>n!==w);T.push({cond:'incongruent',word:w,ink:o[Math.floor(Math.random()*3)]})}
    stroopReal=()=>runS(shuffle(T),0);runS(PRAC,0,true);
  };
}
function runS(T,i,pr){
  if(i>=T.length){pr?stroopReal():finish();return}
  const t=T[i];
  app.innerHTML=`<p class="step">Test 2 of 2: ink color, ${pr?'practice ':''}trial ${i+1} of ${T.length}</p>
  <div class="stage"><span class="fix">+</span></div>
  <div class="btns">${NAMES.map(n=>`<button data-c="${n}">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>`;
  setTimeout(()=>{
    $('.stage').innerHTML=`<span class="word" style="color:${COL[t.ink]}">${t.word.toUpperCase()}</span>`;
    requestAnimationFrame(()=>{
      const t0=performance.now();let done=false;
      const ans=c=>{if(done)return;done=true;document.removeEventListener('keydown',kd);
        const ok=c===t.ink;if(pr){$('.stage').innerHTML=`<span class="word" style="font-size:32px;letter-spacing:0;color:#E9EEF0">${ok?'Correct':'It was '+t.ink}</span>`;setTimeout(()=>runS(T,i+1,pr),800);return}mine.push(row('stroop',i+1,t.cond,c,'',Math.round(performance.now()-t0),ok?1:0));runS(T,i+1)};
      const kd=e=>{const m={r:'red',b:'blue',g:'green',y:'yellow'}[e.key.toLowerCase()];if(m)ans(m)};
      document.addEventListener('keydown',kd);
      document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>ans(b.dataset.c));
    });
  },500);
}

/* Results */
function summ(rs){
  const L=rs.filter(r=>r.test==='line'),by=c=>L.filter(r=>r.condition==='standard_'+c).map(r=>r.illusion_pct);
  const ctrl=mean(by('none')),b=isFinite(ctrl)?ctrl:0,tails=mean(by('tails'))-b,heads=mean(by('heads'))+b,ml=mean([tails,heads].filter(isFinite));
  const s=rs.filter(r=>r.test==='stroop'),good=r=>r.rt_ms>=200&&r.rt_ms<=3000;
  const rt=c=>s.filter(r=>r.condition===c&&r.correct===1&&good(r)).map(r=>r.rt_ms);
  return {ml,tails,heads,ctrl,stroop:mean(rt('incongruent'))-mean(rt('congruent')),acc:mean(s.map(r=>r.correct))*100,excl:s.filter(r=>!good(r)).length};
}

function groupTable(){

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-.000005395239384953];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bc(x,a,b){const T=1e-30,qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<T)d=T;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bc(x,a,b)/a:1-bt*bc(1-x,b,a)/b}
function welch(a,b){a=a.filter(isFinite);b=b.filter(isFinite);if(a.length<2||b.length<2)return null;const va=sd(a)**2/a.length,vb=sd(b)**2/b.length,t=(mean(a)-mean(b))/Math.sqrt(va+vb),df=(va+vb)**2/(va**2/(a.length-1)+vb**2/(b.length-1));return {t,df,p:ib(df/(df+t*t),df/2,.5)}}
function extras(){
  const by={};all.forEach(r=>{(by[r.participant]=by[r.participant]||[]).push(r)});
  const ppl=Object.entries(by).map(([id,rs])=>Object.assign({id,age:rs[0].age,g:rs[0].age_group},summ(rs)));
  if(!ppl.length)return'';
  const pt=`<h2>Per person</h2><div class="scroll"><table><tr><th>ID</th><th>Age</th><th>Illusion (%)</th><th>Outward fins (%)</th><th>Inward fins (%)</th><th>Control error (%)</th><th>Stroop effect (ms)</th><th>Accuracy (%)</th><th>RTs excluded</th></tr>${ppl.map(p=>`<tr><td>${esc(p.id)}</td><td>${p.age}</td><td>${f(p.ml)}</td><td>${f(p.tails)}</td><td>${f(p.heads)}</td><td>${f(p.ctrl)}</td><td>${f(p.stroop,0)}</td><td>${f(p.acc,0)}</td><td>${p.excl}</td></tr>`).join('')}</table></div><p class="mut" style="margin-top:10px">Control error is the average mismatch when neither line had fins. Illusion values subtract it. Stroop times outside 200 to 3000 ms are excluded.</p>`;
  const gs=['under 25','25-39','40+'].filter(k=>ppl.filter(p=>p.g===k).length>=2);
  let tt='<p class="mut">The group t-test appears once two age groups each have at least 2 people.</p>';
  if(gs.length>=2){
    const A=gs[0],B=gs[gs.length-1],pk=(k,m)=>ppl.filter(p=>p.g===k).map(p=>p[m]).filter(isFinite);
    const tr=(lab,m,d)=>{const w=welch(pk(A,m),pk(B,m));return w?`<tr><td>${lab}</td><td>${f(mean(pk(A,m)),d)}</td><td>${f(mean(pk(B,m)),d)}</td><td>${f(w.t,2)}</td><td>${f(w.df,1)}</td><td>${w.p<.001?'<0.001':f(w.p,3)}</td></tr>`:''};
    tt=`<h2>${A} vs ${B} (Welch t-test)</h2><div class="scroll"><table><tr><th>Measure</th><th>${A}</th><th>${B}</th><th>t</th><th>df</th><th>p</th></tr>${tr('Illusion strength (%)','ml',1)}${tr('Stroop effect (ms)','stroop',0)}${tr('Stroop accuracy (%)','acc',0)}</table></div><p class="mut" style="margin-top:10px">A p value below 0.05 suggests a real difference. With small groups, treat it as a hint.</p>`;
  }
  return tt+pt;
}

/* Excel export: builds a real .xlsx (zip of XML) in the browser, no libraries */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};

    const nb=enc.encode(name),d=enc.encode(txt),c=crc32(d);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,d);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+d.length;
  }
  const cdl=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdl),...u32(off),...u16(0)]);

const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
function sheetXml(rows){

  const ss={};all.forEach(r=>{const k=r.participant+'\u0001'+(r.session||0);(ss[k]=ss[k]||[]).push(r)});
  const sess=[['participant','age','age_group','session_date','illusion_strength_pct','outward_fins_pct','inward_fins_pct','control_error_pct','stroop_effect_ms','stroop_accuracy_pct','rts_excluded']]
    .concat(Object.values(ss).map(rs=>{const s=summ(rs);return [rs[0].participant,rs[0].age,rs[0].age_group,dt(rs[0].session),rd(s.ml),rd(s.tails),rd(s.heads),rd(s.ctrl),rd(s.stroop),rd(s.acc),s.excl]}));

    ['[Content_Types].xml',X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${O}sheet.main+xml"/>${names.map((n,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="${O}worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="${O}styles+xml"/></Types>`],
    ['_rels/.rels',X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],

    ['xl/_rels/workbook.xml.rels',X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${names.map((n,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${names.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',X+`<styleSheet xmlns="${M}"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)])

  if(!CFG){res(true);return}
  const d=document.createElement('div');d.className='ovl dlg';
  d.innerHTML='<div class="box"><h1>Owner only</h1><p class="mut">Collected data can only be opened by the owner of this page. Enter the owner passcode.</p><input id="dp" type="password" autocomplete="current-password" placeholder="Passcode"><div class="err" id="de" role="status"></div><div class="row"><button id="dok">Unlock</button><button class="alt" id="dno">Cancel</button></div></div>';
  document.body.appendChild(d);const done=v=>{d.remove();res(v)};
  $('#dp').focus();$('#dno').onclick=()=>done(false);
  const run=async()=>{
    const until=+localStorage.getItem('pl_until')||0;
    if(Date.now()<until){$('#de').textContent='Too many tries. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.';return}
    $('#de').textContent='Checking...';
    try{await unlockOwner($('#dp').value);localStorage.removeItem('pl_fail');idleReset();done(true)}
    catch(e){const n=(+localStorage.getItem('pl_fail')||0)+1;localStorage.setItem('pl_fail',n);if(n%5===0)localStorage.setItem('pl_until',Date.now()+30000);$('#de').textContent=n%5===0?'Too many tries. Locked for 30 seconds.':'Wrong passcode.'}
  };
  $('#dok').onclick=run;$('#dp').onkeydown=e=>{if(e.key==='Enter')run()};
})}
function lockOwner(){
  if(!CFG||!OWNER||document.body.classList.contains('lock'))return;
  clearTimeout(idleT);
  saveQ.then(()=>{PRIV=null;OWNER=false;all=[];keep=[];document.body.classList.remove('owner');go('test')});
}
$('#lockbtn').onclick=lockOwner;
async function migratePlain(){
  if(!CFG)return;
  try{const p=JSON.parse(localStorage.getItem('pl_rows')||'[]');
    if(Array.isArray(p)&&p.length){const ib=getInbox();for(const g of groupRows(p))ib.push(await sealRows(g));setInbox(ib);localStorage.removeItem('pl_rows')}}catch(e){}
}
function codeBlock(code){
  if(!code)return '';
  return `<details style="margin-top:22px"><summary>Taking the test on your own device? Send your result code to the owner</summary><p class="mut" style="margin-top:10px">Copy this code and send it to the owner${CFG&&CFG.contact?' ('+esc(CFG.contact)+')':''}. It is encrypted, so only the owner can read it.</p><textarea id="rcode" readonly aria-label="Result code">${esc(code)}</textarea><div class="row"><button class="alt" id="cpc">Copy code</button></div><div class="err" id="msg6" role="status"></div></details>`;
}
function wireCode(){
  const b=$('#cpc');if(!b)return;
  b.onclick=async()=>{const ta=$('#rcode');let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ta.select();ok=document.execCommand('copy')}catch(e2){}}
    $('#msg6').style.color='var(--mut)';$('#msg6').textContent=ok?'Copied. Now send it to the owner.':'Copy blocked. Select the text and copy it.'};
}
function thanksView(code){
  setNav('test');
  app.innerHTML=`<h1>Thank you</h1><p>Your result has been recorded. Only the owner of this page can see results.</p><div class="row"><button id="nx">Next participant</button></div>${codeBlock(code)}`;
  $('#nx').onclick=()=>go('test');wireCode();
}
function backupBar(){
  const setup=CFG?'':`<h2>Owner lock</h2><p class="mut">Not set up yet, so anyone who opens this page can currently view data on their own device. Choose a passcode that only you know. Illuso then creates a file called <b>owner-config.js</b>. Upload it next to index.html in your GitHub repository. After that, visitors can take the test but cannot open, export or delete any data without your passcode. Keep your passcode safe: it cannot be recovered.</p><label for="ocp">Passcode (10+ characters)</label><input id="ocp" type="password" autocomplete="new-password"><label for="ocq">Repeat passcode</label><input id="ocq" type="password" autocomplete="new-password"><label for="occ">How should participants send you their result code? (optional, for example an email or phone number)</label><input id="occ" type="text" autocomplete="off"><div class="row"><button id="ocb">Create owner lock</button></div><div class="err" id="msg4" role="status"></div>`;
  return `${setup}<h2>Backup, restore and import</h2><p class="mut">Save a backup file regularly. Participants who test on their own device can send you an encrypted result code, which you paste below.</p><div class="row"><button class="alt" id="bk">Save backup file</button><button class="alt" id="rs">Restore from backup</button><input id="rsf" type="file" accept=".json,application/json" hidden></div><div class="err" id="msg2" role="status"></div><label for="imc">Result codes from participants (one per line)</label><textarea id="imc" style="height:90px" placeholder="ILLUSO1:..."></textarea><div class="row"><button class="alt" id="imb">Import codes</button></div><div class="err" id="msg5" role="status"></div>${CFG?'<div class="row"><button class="alt" id="lknow">Lock now</button></div>':''}`;
}
async function deliver(blob,name,say){
  let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data:blob});say('Saved.');return}catch(e){if(e&&e.code==='declined'){say('Cancelled.');return}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);say('Saved as '+name);
}
function mergeRows(rows){
  const key=r=>JSON.stringify([r.participant,r.session,r.test,r.trial]),have=new Set(all.map(key));let n=0;
  rows.forEach(r=>{if(r&&r.participant!==undefined&&!have.has(key(r))){all.push(r);have.add(key(r));n++}});
  return n;
}
function wireBackup(){
  const mk=id=>t=>{const m=$(id);if(m){m.style.color='var(--mut)';m.textContent=t}};
  const say=mk('#msg2'),say4=mk('#msg4'),say5=mk('#msg5');
  $('#bk').onclick=()=>deliver(new Blob([JSON.stringify({app:'illuso',saved:new Date().toISOString(),rows:all},null,1)],{type:'application/json'}),'illuso-backup-'+new Date().toISOString().slice(0,10)+'.json',say);
  $('#rs').onclick=()=>$('#rsf').click();
  $('#rsf').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text()),rows=Array.isArray(j)?j:j.rows;if(!Array.isArray(rows))throw 0;
      const n=mergeRows(rows);save();say(n+' new rows restored. Existing data was kept.');setTimeout(dataView,1200);
    }catch(err){say('That file is not an Illuso backup.')}
    e.target.value='';
  };
  $('#imb').onclick=async()=>{
    const lines=$('#imc').value.split(/\s+/).filter(s=>s.startsWith('ILLUSO1:'));
    if(!lines.length){say5('Paste one or more codes that start with ILLUSO1:');return}
    if(!PRIV){say5('Unlock as the owner first.');return}
    let n=0,bad=0;
    for(const l of lines){try{n+=mergeRows(await openRec(JSON.parse(atob(l.slice(8)))))}catch(e){bad++}}
    save();say5(n+' new rows imported'+(bad?', '+bad+' code(s) could not be read':'')+'.');setTimeout(dataView,1400);
  };
  if($('#lknow'))$('#lknow').onclick=lockOwner;
  if($('#ocb'))$('#ocb').onclick=async()=>{
    const p=$('#ocp').value,q=$('#ocq').value;
    if(p.length<10){say4('Use a passcode of at least 10 characters.');return}
    if(p!==q){say4('The two passcodes do not match.');return}
    if(!(window.crypto&&crypto.subtle)){say4('This needs a secure page (https) or the downloaded file.');return}
    say4('Creating keys (a few seconds)...');
    try{const txt=await makeOwnerConfig(p,$('#occ').value.trim());
      await deliver(new Blob([txt],{type:'text/javascript'}),'owner-config.js',say4);
      say4('Created owner-config.js. Upload it to the same folder as index.html in your repository, then reload the page.');
    }catch(e){say4('Could not create the file.')}
  };
}
async function boot(){
  document.body.classList.toggle('hascfg',!!CFG);
  if(OWNER)document.body.classList.add('owner');
  await migratePlain();
  go('test');
}
function dataView(){
  if(!all.length){app.innerHTML='<h1>Collected data</h1><p class="mut">No data yet. Run a participant in the Take test section, or restore a backup.</p>'+backupBar();wireBackup();return}
  app.innerHTML=`<h1>Collected data</h1><h2 style="margin-top:8px">Group averages</h2>${groupTable()}${extras()}
  <h2>Raw data (CSV)</h2><textarea id="csv" readonly aria-label="CSV data">${esc(csv())}</textarea>
  <div class="row"><button id="xl">Export to Excel</button><button class="alt" id="cp">Copy CSV</button><button class="alt" id="clr">Clear all data</button></div><div class="err" id="msg" role="status"></div>${backupBar()}`;
  $('#cp').onclick=async()=>{const ta=$('#csv');let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ta.select();ok=document.execCommand('copy')}catch(e2){}}
    $('#msg').style.color='var(--mut)';$('#msg').textContent=ok?'Copied. Paste it into Excel or Google Sheets.':'Copy blocked. Select the text above and copy it manually.'};
  $('#clr').onclick=async()=>{if(!clearArm){clearArm=true;$('#clr').textContent='Tap again to delete everything';return}all=[];save(true);clearArm=false;dataView()};
  $('#xl').onclick=exportXlsx;wireBackup();
}
function historyView(){
  const by={};all.forEach(r=>{(by[r.participant]=by[r.participant]||[]).push(r)});
  const ids=Object.keys(by);
  if(!ids.length){app.innerHTML='<h1>History</h1><p class="mut">No participants yet. Results appear here after someone finishes both tests.</p>';return}
  if(!by[hsel])hsel=ids[ids.length-1];
  const rs=by[hsel],ss={};rs.forEach(r=>{const k=r.session||0;(ss[k]=ss[k]||[]).push(r)});
  const keys=Object.keys(ss).sort((a,b)=>a-b);
  const when=k=>+k?new Date(+k).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'Earlier pilot';
  app.innerHTML=`<h1>History</h1><div class="chips">${ids.map(id=>`<button class="chip${id===hsel?' on':''}" data-id="${esc(id)}">${esc(id)}</button>`).join('')}</div>
  <h2>${esc(hsel)}</h2><p class="mut">Age ${rs[0].age}, group ${rs[0].age_group}. ${keys.length} session${keys.length===1?'':'s'}.</p>
  <div class="scroll"><table><tr><th>When</th><th>Illusion (%)</th><th>Outward (%)</th><th>Inward (%)</th><th>Control (%)</th><th>Stroop (ms)</th><th>Accuracy (%)</th></tr>${keys.map(k=>{const s=summ(ss[k]);return `<tr><td>${when(k)}</td><td>${f(s.ml)}</td><td>${f(s.tails)}</td><td>${f(s.heads)}</td><td>${f(s.ctrl)}</td><td>${f(s.stroop,0)}</td><td>${f(s.acc,0)}</td></tr>`}).join('')}</table></div>
  <div class="row"><button class="alt" id="del">Delete this person's data</button></div>`;
  $$('.chip').forEach(b=>b.onclick=()=>{hsel=b.dataset.id;dclr=false;historyView()});
  $('#del').onclick=async()=>{if(!dclr){dclr=true;$('#del').textContent='Tap again to delete';return}dclr=false;all=all.filter(r=>r.participant!==hsel);save(true);hsel=null;historyView()};
}
boot();
</script></body></html>
